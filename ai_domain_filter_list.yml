schema_version: '1.0'
purpose: AI service domain allow/exclude lists for log aggregation
matching:
  host_extraction: parse URL -> hostname (lowercase)
  rule: host == domain OR host endswith '.' + domain
  priority: EXCLUDE first, then ALLOW (so broad bases can be suppressed)
